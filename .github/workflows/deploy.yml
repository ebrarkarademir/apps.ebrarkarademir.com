# Builds the site and deploys it to Firebase Hosting. The branch name is the hosting target
# in firebase.json:
#   prod -> https://apps-76619.web.app (also apps-76619.firebaseapp.com)
#   dev  -> https://apps-76619-dev.web.app
name: Deploy to Firebase

on:
  push:
    branches: [prod, dev]
  workflow_dispatch:

# A newer push to the same branch replaces a deploy that is still running
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == 'prod' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: ${{ github.ref_name == 'prod' && 'https://apps-76619.web.app' || 'https://apps-76619-dev.web.app' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
        env:
          # Optional TURN relay for online games (see web/.env.example); empty if unset
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APPS_76619 }}
          projectId: apps-76619
          target: ${{ github.ref_name }}
          channelId: live
